    <script>
        window.addEventListener("load", () => {
            // VERIFICATION : Si GSAP n'est pas là, on ne fait rien (pas de crash)
            if (typeof gsap !== "undefined") {
                
                const tl = gsap.timeline({ delay: 0.2 });

                // On utilise FROM pour animer "depuis" l'invisible vers le visible
                // C'est beaucoup plus sûr : si JS plante, les éléments sont DÉJÀ visibles.
                tl.from(".page-title", { opacity: 0, y: 30, duration: 1, ease: "power2.out" });
                tl.from(".form-group", { opacity: 0, y: 20, duration: 0.8, stagger: 0.2, ease: "power2.out" }, "-=0.5");
                tl.from(".social-link", { opacity: 0, x: 30, duration: 0.8, stagger: 0.2, ease: "power2.out" }, "-=1");

                // LOGIQUE AJAX FORMULAIRE
                const form = document.getElementById("contact-form");
                const successMessage = document.querySelector(".success-message");
                
                if(form) {
                    form.addEventListener("submit", async function(event) {
                        event.preventDefault();

                        const formData = new FormData(form);
                        const button = form.querySelector("button");
                        const originalText = button.textContent;
                        button.textContent = "Envoi...";
                        
                        try {
                            const response = await fetch(form.action, {
                                method: form.method,
                                body: formData,
                                headers: { 'Accept': 'application/json' }
                            });

                            if (response.ok) {
                                gsap.to(form, { 
                                    opacity: 0, 
                                    duration: 0.5, 
                                    onComplete: () => {
                                        form.style.display = "none";
                                        successMessage.style.display = "block";
                                        gsap.fromTo(successMessage, 
                                            { opacity: 0, y: 20 }, 
                                            { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }
                                        );
                                    }
                                });
                                form.reset();
                            } else {
                                alert("Oups ! Problème d'envoi.");
                                button.textContent = originalText;
                            }
                        } catch (error) {
                            alert("Oups ! Problème d'envoi.");
                            button.textContent = originalText;
                        }
                    });
                }
            }
            const menuToggle = document.querySelector('.menu-toggle');
            const menuText = document.querySelector('.menu-text');
            const menuOverlay = document.querySelector('.menu-overlay');
            
            const menuTl = gsap.timeline({ paused: true });

            menuTl
                .to(menuOverlay, { autoAlpha: 1, duration: 0.5 })
                .to(".menu-top", { opacity: 1, y: 0, duration: 0.5 }, "-=0.3")
                .to(".menu-line", { scaleX: 1, duration: 0.8, ease: "power2.out", stagger: 0.1 }, "-=0.3")
                .to(".menu-link-item", { opacity: 1, y: 0, duration: 0.8, ease: "power2.out", stagger: 0.1 }, "-=0.8")
                .to(".menu-bottom", { opacity: 1, y: 0, duration: 0.5 }, "-=0.6");

            let isMenuOpen = false;

            if (menuToggle) {
                menuToggle.addEventListener('click', () => {
                    if (!isMenuOpen) {
                        menuTl.play();
                        menuText.textContent = "CLOSE"; 
                        isMenuOpen = true;
                    } else {
                        menuTl.reverse();
                        menuText.textContent = "MENU";
                        isMenuOpen = false;
                    }
                });
            }
        });
    </script>
